name: Compilar APK de prueba

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

# Necesario para crear la versión en Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          rama="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "salida/BismoPower-${rama}-${GITHUB_RUN_NUMBER}-debug.apk"
          ls -la salida

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BismoPower-debug-${{ github.run_number }}
          path: salida/*.apk
          retention-days: 30

      - name: Publicar en Releases (solo main, para descargar desde el celular)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BismoPower 0.1 (compilación ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK de prueba compilado desde `${{ github.sha }}`.
            Desde el celular: toca el archivo **.apk** de abajo para descargarlo e instalarlo
            (Android te pedirá permitir instalar apps desde el navegador la primera vez).
          files: salida/*.apk

name: Compilar APK firmado

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

# Necesario para crear la versión en Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.BISMO_KEYSTORE_BASE64 }}
      # Versión de la app: VERSION_BASE.<número>. Para pasar a 0.4.x cambia VERSION_BASE
      # a "0.4" y PARCHE_DESDE al número de la última compilación, así vuelve a empezar en .1
      VERSION_BASE: "0.3"
      PARCHE_DESDE: 7
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calcular la versión
        run: |
          parche=$(( GITHUB_RUN_NUMBER - PARCHE_DESDE ))
          if [ "$parche" -lt 1 ]; then parche=1; fi
          version="${VERSION_BASE}.${parche}"
          echo "BISMO_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "BISMO_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Versión: $version (código $GITHUB_RUN_NUMBER)"

      # El keystore vive en los secretos del repositorio (en texto base64), nunca en el código.
      - name: Preparar la firma (solo si configuraste los secretos)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bismopower.jks"
          echo "BISMO_KEYSTORE_PATH=$RUNNER_TEMP/bismopower.jks" >> "$GITHUB_ENV"

      - name: Avisar si falta la firma
        if: env.KEYSTORE_B64 == ''
        run: echo "::warning::No están los secretos BISMO_*; el APK queda firmado con la clave de depuración."

      - name: Compilar APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          BISMO_KEYSTORE_PASSWORD: ${{ secrets.BISMO_KEYSTORE_PASSWORD }}
          BISMO_KEY_ALIAS: ${{ secrets.BISMO_KEY_ALIAS }}
          BISMO_KEY_PASSWORD: ${{ secrets.BISMO_KEY_PASSWORD }}

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/BismoPower-${BISMO_VERSION_NAME}.apk"
          ls -la salida

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BismoPower-${{ env.BISMO_VERSION_NAME }}
          path: salida/*.apk
          retention-days: 30

      - name: Publicar en Releases (solo main, para descargar desde el celular)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BISMO_VERSION_NAME }}
          name: BismoPower ${{ env.BISMO_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK firmado, compilado desde `${{ github.sha }}`.
            Desde el celular: toca el archivo **.apk** de abajo para descargarlo e instalarlo.
          files: salida/*.apk
